```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camping Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      margin: 20px auto;
      padding: 20px;
      max-width: 500px;
      border-radius: 10px;
      background: white;
      font-size: 22px;
      font-weight: bold;
    }

    button {
      padding: 16px 28px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #333;
      color: white;
      margin: 15px auto;
      display: block;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <h1>Camping Scanner</h1>

  <button id="startCamera" onclick="startScanner()">
    START CAMERA
  </button>

  <div id="reader"></div>

  <div id="result" class="hidden"></div>

  <script>

    const CAMPING_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx5Cjdd1dWc8Afr5nzJQfE8q6pjRZP8ef8_2aUN77s8GoBw_hBAYutGaaUsG51dJ4-YKQ/exec";

    let scanner = null;
    let hasScanned = false;


    async function startScanner() {

      if (scanner) {
        return;
      }

      document
        .getElementById("startCamera")
        .classList.add("hidden");

      document
        .getElementById("result")
        .classList.add("hidden");

      hasScanned = false;

      scanner = new Html5Qrcode("reader");

      try {

        await scanner.start(
          { facingMode: "environment" },

          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },

          function(decodedText) {

            if (hasScanned) {
              return;
            }

            hasScanned = true;

            checkCampingQR(decodedText);
          },

          function(errorMessage) {
            // Ignore normal QR scanning errors.
          }

        );

      } catch (error) {

        console.log(error);

        scanner = null;

        document
          .getElementById("startCamera")
          .classList.remove("hidden");

        showResult(
          "CAMERA ERROR<br><br>" +
          "Please check that Firefox has camera permission."
        );
      }
    }


    async function checkCampingQR(qrCode) {

      showResult("CHECKING...");

      if (scanner) {

        try {
          await scanner.stop();
        } catch (e) {}

        try {
          await scanner.clear();
        } catch (e) {}

        scanner = null;
      }

      const url =
        CAMPING_SCRIPT_URL +
        "?action=check&ticket=" +
        encodeURIComponent(qrCode);

      window.location.href = url;
    }


    function showResult(message) {

      const result =
        document.getElementById("result");

      result.innerHTML = message;

      result.classList.remove("hidden");
    }

  </script>

</body>
</html>
